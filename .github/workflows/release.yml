name: Release

# Manual: Actions -> Release -> Run workflow -> enter the tag (e.g. v2.4).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, must match android:versionName (e.g. v2.4 for versionName 2.4)'
        required: true
      notes:
        description: 'Release notes (optional, autogenerated when empty)'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Verify tag matches the module version
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          VER="$(grep -o 'android:versionName="[^"]*"' lsp_module/AndroidManifest.xml | head -1 | cut -d'"' -f2)"
          TAG="$TAG_INPUT"
          if [ "$TAG" != "v$VER" ] && [ "$TAG" != "$VER" ]; then
            echo "::error::tag '$TAG' does not match android:versionName '$VER' (bump the manifest first)"
            exit 1
          fi
          echo "releasing version $VER as $TAG"

      - name: Build signed APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: bash lsp_module/build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: lsp_module/edge_download_change-*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          APK="$(ls lsp_module/edge_download_change-*.apk | head -1)"
          VER="$(grep -o 'android:versionName="[^"]*"' lsp_module/AndroidManifest.xml | head -1 | cut -d'"' -f2)"
          NOTES="$NOTES_INPUT"
          if [ -z "$NOTES" ]; then
            NOTES="Signed APK (versionName ${VER}), built from ${GITHUB_SHA}.

          See README.md for installation and usage."
          fi
          gh release create "$TAG_INPUT" \
            --title "$TAG_INPUT" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "$NOTES"
          gh release upload "$TAG_INPUT" "$APK"
