name: Release

# Manual: Actions -> Release -> Run workflow.
# Publishes a stable release with the tag format required by the official module
# repository: <versionCode>-<versionName> (e.g. "6-2.4").
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name to release, must match android:versionName (e.g. 2.4)'
        required: true
      notes:
        description: 'Release notes (optional, autogenerated when empty)'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK (ANDROID_SDK_ROOT / ANDROID_HOME);
      # android-actions/setup-android is deliberately not used because recent
      # versions fail on the removed legacy "tools" package.
      - name: Ensure Android platform and build-tools
        run: |
          echo "sdk root: ${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" | tail -3

      - name: Verify the requested version matches the manifest
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VER="$(grep -o 'android:versionName="[^"]*"' lsp_module/AndroidManifest.xml | head -1 | cut -d'"' -f2)"
          if [ "$VERSION_INPUT" != "$VER" ]; then
            echo "::error::input '$VERSION_INPUT' does not match android:versionName '$VER' (bump the manifest first)"
            exit 1
          fi
          echo "releasing versionName $VER"

      - name: Build signed APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: bash lsp_module/build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: lsp_module/edge_download_change-*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          APK="$(ls lsp_module/edge_download_change-*.apk | head -1)"
          CODE="$(grep -o 'android:versionCode="[^"]*"' lsp_module/AndroidManifest.xml | head -1 | cut -d'"' -f2)"
          VER="$(grep -o 'android:versionName="[^"]*"' lsp_module/AndroidManifest.xml | head -1 | cut -d'"' -f2)"
          TAG="${CODE}-${VER}"          # tag format required by the official module repo
          NOTES="$NOTES_INPUT"
          if [ -z "$NOTES" ]; then
            NOTES="已签名的稳定版（versionCode ${CODE} / versionName ${VER}），可直接覆盖安装。

          Signed stable build (versionCode ${CODE}, versionName ${VER}), built from \`${GITHUB_SHA}\`.

          安装与使用说明见 README.md。"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::release $TAG already exists - bump android:versionCode/versionName first"
            exit 1
          fi
          gh release create "$TAG" \
            --title "v${VER}" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "$NOTES"
          gh release upload "$TAG" "$APK"
          echo "published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
