name: Release

# One-click stable release.
#   Actions -> Release -> Run workflow   (leave "version" empty to auto-increment)
#
# The workflow does everything:
#   1. bump versionCode (+1) and versionName in the manifest (and BuildInfo.VERSION)
#   2. commit that to main with [skip ci] (so no extra beta build is triggered)
#   3. build and sign the APK
#   4. publish the GitHub release with the tag <versionCode>-<versionName>
#      (the format the official module repository requires)
#   5. mirror the same release + APK into the official module repository
#      (only when the MODULE_REPO_TOKEN secret is configured)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New versionName (e.g. 2.7). Leave empty to bump the last number automatically.'
        required: false
      notes:
        description: 'Release notes (optional, autogenerated when empty)'
        required: false

permissions:
  contents: write

env:
  MODULE_REPO: Xposed-Modules-Repo/io.github.lswlc33.edge_download_change
  MODULE_REPO_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK (ANDROID_SDK_ROOT / ANDROID_HOME);
      # android-actions/setup-android is deliberately not used because recent
      # versions fail on the removed legacy "tools" package.
      - name: Ensure Android platform and build-tools
        run: |
          echo "sdk root: ${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" | tail -3

      - name: Bump the version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -e
          MANIFEST=lsp_module/AndroidManifest.xml
          OLD_CODE="$(grep -o 'android:versionCode="[^"]*"' "$MANIFEST" | head -1 | cut -d'"' -f2)"
          OLD_NAME="$(grep -o 'android:versionName="[^"]*"' "$MANIFEST" | head -1 | cut -d'"' -f2)"
          NEW_CODE=$((OLD_CODE + 1))
          if [ -n "$VERSION_INPUT" ]; then
            NEW_NAME="$VERSION_INPUT"
          else
            # auto-increment the last numeric segment: 2.6 -> 2.7, 2.6.1 -> 2.6.2
            # BEGIN{OFS} must be set before the field is modified, otherwise the
            # rebuilt value uses the default separator (2.6 -> "2 7")
            NEW_NAME="$(echo "$OLD_NAME" | awk -F. 'BEGIN{OFS="."} { $NF = $NF + 1; print }')"
          fi
          case "$NEW_NAME" in
            *beta*|*alpha*|*Beta*|*Alpha*)
              echo "::error::'$NEW_NAME' looks like a pre-release; betas are published by the Beta workflow"
              exit 1 ;;
          esac
          sed -i "s/android:versionCode=\"[^\"]*\"/android:versionCode=\"${NEW_CODE}\"/" "$MANIFEST"
          sed -i "s/android:versionName=\"[^\"]*\"/android:versionName=\"${NEW_NAME}\"/" "$MANIFEST"
          sed -i "s/static final String VERSION = \"[^\"]*\";/static final String VERSION = \"${NEW_NAME}\";/" \
            lsp_module/src/io/github/lswlc33/edge_download_change/BuildInfo.java
          echo "version: ${OLD_NAME} (${OLD_CODE}) -> ${NEW_NAME} (${NEW_CODE})"
          grep -E 'versionCode|versionName' "$MANIFEST"
          echo "code=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_CODE}-${NEW_NAME}" >> "$GITHUB_OUTPUT"

      - name: Commit the version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lsp_module/AndroidManifest.xml \
                  lsp_module/src/io/github/lswlc33/edge_download_change/BuildInfo.java
          # [skip ci] keeps this push from triggering another beta build
          git commit -m "chore(release): v${{ steps.version.outputs.name }} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build signed APK
        id: build
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          APK="$(bash lsp_module/build.sh | sed -n 's/^done: //p' | tail -1)"
          test -f "lsp_module/$APK" || { echo "::error::build artifact not found: $APK"; exit 1; }
          echo "apk=lsp_module/$APK" >> "$GITHUB_OUTPUT"
          echo "built: $APK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VER: ${{ steps.version.outputs.name }}
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          NOTES="$NOTES_INPUT"
          if [ -z "$NOTES" ]; then
            NOTES="稳定版 **v${VER}**，已签名，可直接覆盖安装。

          Signed stable build **v${VER}**, built from \`${GITHUB_SHA}\`. Install and usage: see README.md."
          fi
          gh release create "$TAG" \
            --title "v${VER}" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "$NOTES"
          gh release upload "$TAG" "${{ steps.build.outputs.apk }}"
          echo "published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Mirror into the official module repository
        if: ${{ env.MODULE_REPO_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.MODULE_REPO_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VER: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          APK="${{ steps.build.outputs.apk }}"
          NOTES="Signed stable build of edge_download_change (versionCode ${CODE}, versionName ${VER}).

          Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          if gh release view "$TAG" --repo "$MODULE_REPO" > /dev/null 2>&1; then
            echo "release $TAG already exists in $MODULE_REPO, uploading the asset"
          else
            gh release create "$TAG" --repo "$MODULE_REPO" --title "v${VER}" --notes "$NOTES"
          fi
          gh release upload "$TAG" --repo "$MODULE_REPO" "$APK" --clobber
          echo "mirrored: https://github.com/${MODULE_REPO}/releases/tag/${TAG}"

      - name: Note when mirroring is not configured
        if: ${{ env.MODULE_REPO_TOKEN == '' }}
        run: |
          echo "::notice title=Official module repository::Skipped. Add the MODULE_REPO_TOKEN secret (a token with write access to ${MODULE_REPO}) to publish there automatically."
