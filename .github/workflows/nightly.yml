name: Beta (nightly)

# Every push to main builds a beta APK and publishes it as a pre-release:
#   - versionName becomes <version>-beta.<run_number>
#   - tag is <versionCode>-<versionName> (the format the official module repository
#     requires) and the versionName contains "beta", so it is filed under the beta
#     channel there
#   - the release is mirrored into the official module repository when the
#     MODULE_REPO_TOKEN secret is configured
on:
  push:
    branches: [main, master]
    paths-ignore: ['**/*.md', '.gitignore']
  workflow_dispatch:

concurrency:
  group: beta
  cancel-in-progress: true

permissions:
  contents: write

env:
  MODULE_REPO: Xposed-Modules-Repo/io.github.lswlc33.edge_download_change
  MODULE_REPO_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}

jobs:
  beta:
    name: Build beta APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK (ANDROID_SDK_ROOT / ANDROID_HOME);
      # android-actions/setup-android is deliberately not used because recent
      # versions fail on the removed legacy "tools" package.
      - name: Ensure Android platform and build-tools
        run: |
          echo "sdk root: ${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" | tail -3

      - name: Mark this build as a beta
        id: meta
        run: |
          BASE="$(grep -o 'android:versionName="[^"]*"' lsp_module/AndroidManifest.xml | head -1 | cut -d'"' -f2)"
          CODE="$(grep -o 'android:versionCode="[^"]*"' lsp_module/AndroidManifest.xml | head -1 | cut -d'"' -f2)"
          VER="${BASE}-beta.${GITHUB_RUN_NUMBER}"
          sed -i "s/android:versionName=\"[^\"]*\"/android:versionName=\"${VER}\"/" lsp_module/AndroidManifest.xml
          grep -E 'versionCode|versionName' lsp_module/AndroidManifest.xml
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${CODE}-${VER}" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        id: build
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # The artifact path comes from the build output instead of a glob so a stale
          # file can never be picked up.
          APK="$(bash lsp_module/build.sh | sed -n 's/^done: //p' | tail -1)"
          test -f "lsp_module/$APK" || { echo "::error::build artifact not found: $APK"; exit 1; }
          echo "apk=lsp_module/$APK" >> "$GITHUB_OUTPUT"
          echo "built: $APK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-apk
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error

      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          NOTES="Beta build - served through the beta channel of the official module repository (versionName contains \"beta\").

          - version: ${VER}
          - commit: \`${GITHUB_SHA}\`
          - branch: \`${GITHUB_REF_NAME}\`
          - built: $(date -u '+%Y-%m-%d %H:%M UTC')
          - run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Signed with the same key as stable releases, so it installs over them."
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "v${VER}" \
            --notes "$NOTES"
          gh release upload "$TAG" "${{ steps.build.outputs.apk }}"

      - name: Mirror into the official module repository
        if: ${{ env.MODULE_REPO_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.MODULE_REPO_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "$TAG" --repo "$MODULE_REPO" \
            --prerelease \
            --title "v${VER}" \
            --notes "Beta build - beta channel (versionName contains \"beta\").

          Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" || true
          gh release upload "$TAG" --repo "$MODULE_REPO" "${{ steps.build.outputs.apk }}" --clobber
          echo "mirrored: https://github.com/${MODULE_REPO}/releases/tag/${TAG}"

      - name: Note when mirroring is not configured
        if: ${{ env.MODULE_REPO_TOKEN == '' }}
        run: |
          echo "::notice title=Official module repository::Skipped. Add the MODULE_REPO_TOKEN secret to publish betas there automatically."

      - name: Prune old beta releases
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_REPO_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}
        run: |
          prune() {
            local repo="$1" token="$2" count="$3"
            GH_TOKEN="$token" gh release list --repo "$repo" --limit 100 --json tagName,isPrerelease \
              -q "[.[] | select(.isPrerelease)][${count}:] | .[].tagName" 2>/dev/null \
            | while read -r tag; do
                [ -n "$tag" ] || continue
                echo "pruning old beta in $repo: $tag"
                GH_TOKEN="$token" gh release delete "$tag" --repo "$repo" --yes --cleanup-tag || true
              done
          }
          prune "${GITHUB_REPOSITORY}" "$GH_TOKEN" 10
          if [ -n "$MODULE_REPO_TOKEN" ]; then prune "$MODULE_REPO" "$MODULE_REPO_TOKEN" 10; fi
